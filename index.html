<style>
:root{
  --bg:#161616; --card:#292929; --card-low:#252525; --ink:#c4c4c4; --ui:#e6e6e6; --muted:#8a8a8a;
  --split:#0c0c0c; --ring:#555; --panel:#222; --edge:#333;
  --pad:84px; --c:min(calc((100vw - 2*var(--pad) - 24px)/2.38),62vh);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:#fff;--card:#f3f3f1;--card-low:#ebebe8;--ink:#26272b;--ui:#26272b;--muted:#9a9ba1;--split:#fff;--ring:#c9c9c4;--panel:#fff;--edge:#e7e7e4;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ui);font-family:Helvetica,Arial,sans-serif;transition:background .25s}
button{font-family:inherit}
button:focus-visible{outline:2px solid var(--ui);outline-offset:3px}

.brand{position:fixed;top:18px;left:0;right:0;margin:0;text-align:center;font:italic 400 17px Georgia,"Times New Roman",serif;color:var(--ui)}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.clock{display:flex;align-items:flex-end;gap:12px}

.card{--s:var(--c);position:relative;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.045);
  font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:calc(var(--s)*.97);line-height:1;color:var(--ink);
  perspective:calc(var(--s)*4);-webkit-text-stroke:calc(var(--s)*.012) currentColor}
.card.small{--s:calc(var(--c)*.38)}
.half,.f{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--card)}
.t{top:0;border-radius:calc(var(--s)*.045) calc(var(--s)*.045) 0 0}
.b{bottom:0;border-radius:0 0 calc(var(--s)*.045) calc(var(--s)*.045);background:var(--card-low)}
.t span,.b span{position:absolute;left:0;right:0;height:200%;padding-top:.1em;display:flex;align-items:center;justify-content:center}
.t span{top:0}.b span{bottom:0}
.f{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f.t{transform-origin:50% 100%}
.f.b{transform-origin:50% 0;transform:rotateX(90deg)}
.f{will-change:transform}
.f::after,.half::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.go .half.t::after{animation:reveal .6s linear forwards}
.go .half.b::after{animation:cast .3s ease-in forwards}
@keyframes reveal{from{opacity:.45}to{opacity:0}}
@keyframes cast{to{opacity:.45}}
.card::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:var(--split);z-index:5}
.go .f.t{animation:fall .3s ease-in forwards}
.go .f.b{animation:land .3s .3s ease-out forwards}
.go .f.t::after{animation:shT .3s ease-in forwards}
.go .f.b::after{animation:shB .3s .3s ease-out forwards}
@keyframes fall{to{transform:rotateX(-90deg)}}
@keyframes land{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
@keyframes shT{to{opacity:.6}}
@keyframes shB{from{opacity:.6}to{opacity:0}}
.tag{position:absolute;left:calc(var(--s)*.055);bottom:calc(var(--s)*.05);z-index:6;font-style:normal;font-size:calc(var(--s)*.09);letter-spacing:.02em;opacity:.7;-webkit-text-stroke:0}

.side{position:fixed;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:10}
.side.l{left:15px}.side.r{right:15px}
.rb{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ui);background:none;border:1px solid var(--ui);border-radius:50%;cursor:pointer;opacity:.8}
.rb:hover{opacity:1}
.rb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rb svg.i-play{fill:currentColor;stroke-width:1}
.rb svg.i-pause{stroke-width:3}
#rotate{display:none}
@media (pointer:coarse){#rotate{display:flex}}
html[data-theme="dark"] .i-moon,html[data-theme="light"] .i-sun{display:none}
#sound[aria-pressed="true"] .i-off,#sound[aria-pressed="false"] .i-on{display:none}
#toggle[data-run="true"] .i-play,#toggle:not([data-run="true"]) .i-pause{display:none}

.foot{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px}
.modes button{background:none;border:0;padding:6px 8px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{color:var(--ui)}
.keys{margin:2px 0 0;font-size:10px;color:var(--muted)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.overlay[hidden]{display:none}
.panel{background:var(--panel);color:var(--ui);border:1px solid var(--edge);border-radius:12px;padding:24px;width:min(340px,100%);display:flex;flex-direction:column;gap:16px}
.panel h2{margin:0;font-size:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.row input{width:84px;font-family:inherit;font-size:16px;color:var(--ui);background:var(--bg);border:1px solid var(--ring);border-radius:8px;padding:10px 12px;text-align:right}
.hint{margin:0;font-size:13px;color:var(--muted)}
.acts{display:flex;gap:10px;justify-content:flex-end}
.acts button{font-size:15px;padding:10px 20px;border-radius:999px;cursor:pointer;border:1px solid var(--ring);background:none;color:var(--ui)}
.acts .ok{background:var(--ui);color:var(--bg);border-color:var(--ui)}

html.fs{--c:min(calc((100vw - 48px - 24px)/2.38),84vh)}
.fs .side,.fs .brand,.fs .foot{display:none}
.fs body{touch-action:manipulation}
html.rot body{position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
@supports (height:100dvh){html.rot body{width:100dvh;height:100dvw;transform:translateX(100dvw) rotate(90deg)}}
html.rot{--pad:14px;--c:min(calc((100vh - 2*var(--pad) - 24px)/2.38),62vw)}
html.fs.rot{--c:min(calc((100vh - 72px)/2.38),84vw)}
@supports (height:100dvh){html.rot{--c:min(calc((100dvh - 2*var(--pad) - 24px)/2.38),62dvw)}html.fs.rot{--c:min(calc((100dvh - 72px)/2.38),84dvw)}}
.rot .side{top:52px;transform:none;flex-direction:row}.rot .side.l{left:12px}.rot .side.r{right:12px}
@media (max-width:640px){:root{--pad:14px}.side{top:52px;transform:none;flex-direction:row}.side.l{left:12px}.side.r{right:12px}}
</style>
</head>

</div>
<div class="side r">
  <button class="rb" id="toggle" data-run="false" aria-label="Iniciar" title="Iniciar"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
  <button class="rb" id="reset" aria-label="Reiniciar" title="Reiniciar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4h4"/></svg></button>
</div>

<main class="stage">
  <div class="clock" role="timer" aria-live="off">
    <div class="card" id="cm" aria-label="Minutos"><em class="tag" id="tag">ENFOQUE</em></div>
    <div class="card" id="cs" aria-label="Segundos"></div>
    <div class="card small" id="cc" aria-label="Pomodoros completados" title="Pomodoros completados"></div>
  </div>
</main>

<footer class="foot">
  <nav class="modes" aria-label="Modo">
    <button data-mode="focus" aria-pressed="true">enfoque</button>
    <button data-mode="short" aria-pressed="false">pausa corta</button>
    <button data-mode="long" aria-pressed="false">pausa larga</button>
  </nav>
  <p class="keys">espacio &middot; iniciar / pausar &nbsp;&nbsp; f &middot; pantalla completa</p>
</footer>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
    <h2 id="ptitle">Ajustes</h2>
    <label class="row">Enfoque (min)<input id="in-focus" type="number" min="1" max="99" inputmode="numeric"></label>
    <label class="row">Pausa corta (min)<input id="in-short" type="number" min="1" max="99" inputmode="numeric"></label>
    <label class="row">Pausa larga (min)<input id="in-long" type="number" min="1" max="99" inputmode="numeric"></label>
    <p class="hint" id="hint">Entre 1 y 99 minutos.</p>
    <div class="acts"><button id="cancel">Cancelar</button><button id="save" class="ok">Guardar</button></div>
  </div>
</div>

<script>
(function(){
  var DUR={focus:25*60,short:5*60,long:15*60};
  try{var sv=JSON.parse(localStorage.getItem('pomo-dur')||'null');if(sv)['focus','short','long'].forEach(function(k){var n=Math.round(+sv[k]);if(n>=1&&n<=99)DUR[k]=n*60})}catch(e){}
  var NAMES={focus:'ENFOQUE',short:'PAUSA CORTA',long:'PAUSA LARGA'};
  var mode='focus', remaining=DUR.focus, running=false, endAt=0, done=0, timer=null, audio=null, soundOn=true;
  var $=function(id){return document.getElementById(id)};

  function Flip(el){
    el.insertAdjacentHTML('afterbegin','<div class="half t"><span></span></div><div class="half b"><span></span></div><div class="f t"><span></span></div><div class="f b"><span></span></div>');
    var s=el.querySelectorAll('span'), cur=null, tid=null;
    function fill(a,b,c,d){s[0].textContent=a;s[1].textContent=b;s[2].textContent=c;s[3].textContent=d}
    function finish(){clearTimeout(tid);el.classList.remove('go');fill(cur,cur,cur,cur)}
    return {set:function(v,instant){
      if(v===cur)return;
      if(el.classList.contains('go'))finish();
      if(cur===null||instant){clearTimeout(tid);el.classList.remove('go');cur=v;fill(v,v,v,v);return}
      var old=cur; cur=v;
      fill(v,old,old,v);
      void el.offsetWidth; el.classList.add('go');
      tid=setTimeout(finish,680);
    }};
  }
  var cm=Flip($('cm')), cs=Flip($('cs')), cc=Flip($('cc'));
  function p2(n){return (n<10?'0':'')+n}

  function render(instant){
    var r=Math.max(0,Math.ceil(remaining)), mm=Math.floor(r/60), ss=r%60;
    cm.set(p2(mm),instant); cs.set(p2(ss),instant); cc.set(p2(Math.min(done,99)),instant);
    document.title=(running?'\u25cf ':'')+p2(mm)+':'+p2(ss)+' \u00b7 Pomodoro';
  }

  var wl=null, wlBusy=false;
  function lockScreen(){
    try{
      if(wl||wlBusy||!navigator.wakeLock)return;
      wlBusy=true;
      navigator.wakeLock.request('screen').then(function(l){
        wlBusy=false;
        if(!running){l.release();return}
        wl=l; l.addEventListener('release',function(){wl=null});
      }).catch(function(){wlBusy=false});
    }catch(e){wlBusy=false}
  }
  function unlockScreen(){try{if(wl){wl.release();wl=null}}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&running)lockScreen()});

  function setRun(v){
    running=v; if(v)lockScreen();else unlockScreen(); var b=$('toggle'); b.dataset.run=v?'true':'false';
    var l=v?'Pausar':'Iniciar'; b.setAttribute('aria-label',l); b.title=l;
  }

  function beep(){
    if(!soundOn)return;
    try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    try{
      if(audio&&audio.state==='suspended')audio.resume();
      audio=audio||new (window.AudioContext||window.webkitAudioContext)();
      [0,0.3,0.6,1.2,1.5,1.8,2.4,2.7,3.0].forEach(function(t,i){
        var o=audio.createOscillator(),g=audio.createGain();
        o.type='triangle';o.frequency.value=i%3===1?1175:880;o.connect(g);g.connect(audio.destination);
        var n=audio.currentTime+t;
        g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(0.6,n+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,n+0.25);
        o.start(n);o.stop(n+0.3);
      });
    }catch(e){}
  }

  function setMode(next){
    mode=next; clearTimeout(timer); setRun(false);
    remaining=DUR[mode];
    $('tag').textContent=NAMES[mode];
    document.querySelectorAll('.modes button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.mode===mode)});
    render(true);
  }

  function tick(){
    remaining=(endAt-Date.now())/1000;
    if(remaining<=0){
      remaining=0; render(); beep();
      if(mode==='focus'){setMode((done+1)%4===0?'long':'short');done++;cc.set(p2(Math.min(done,99)))}
      else setMode('focus');
      return;
    }
    render(); schedule();
  }

  function schedule(){
    var ms=(endAt-Date.now())%1000; if(ms<20)ms+=1000;
    timer=setTimeout(tick,ms+8);
  }

  function toggle(){
    if(running){clearTimeout(timer);setRun(false);render();return}
    try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}
    setRun(true); endAt=Date.now()+remaining*1000;
    render(); schedule();
  }

  $('toggle').addEventListener('click',toggle);
  $('reset').addEventListener('click',function(){setMode(mode)});
  document.querySelectorAll('.modes button').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.mode)})});

  var root=document.documentElement, tb=$('theme'), sb=$('sound');
  function setTheme(t,save){
    root.setAttribute('data-theme',t);
    var l=t==='dark'?'Modo claro':'Modo oscuro'; tb.setAttribute('aria-label',l); tb.title=l;
    if(save){try{localStorage.setItem('pomo-theme2',t)}catch(e){}}
  }
  var saved=null;try{saved=localStorage.getItem('pomo-theme2')}catch(e){}
  setTheme(saved==='light'?'light':'dark');
  tb.addEventListener('click',function(){setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark',true)});
  sb.addEventListener('click',function(){
    soundOn=!soundOn; sb.setAttribute('aria-pressed',soundOn);
    var l=soundOn?'Silenciar sonido':'Activar sonido'; sb.setAttribute('aria-label',l); sb.title=l;
    if(!soundOn)return;
    try{
      audio=audio||new (window.AudioContext||window.webkitAudioContext)();
      if(audio.state==='suspended')audio.resume();
      var o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;
      o.type='triangle';o.frequency.value=880;o.connect(g);g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(0.5,n+0.02);g.gain.exponentialRampToValueAtTime(0.0001,n+0.3);
      o.start(n);o.stop(n+0.35);
    }catch(e){}
  });

  var ov=$('overlay'), hint=$('hint');
  var ins={focus:$('in-focus'),short:$('in-short'),long:$('in-long')};
  function openSettings(){
    for(var k in ins)ins[k].value=DUR[k]/60;
    hint.textContent='Entre 1 y 99 minutos.';
    ov.hidden=false;ins.focus.focus();ins.focus.select();
  }
  function closeSettings(){ov.hidden=true;$('settings').focus()}
  function saveSettings(){
    var vals={};
    for(var k in ins){
      var n=Number(ins[k].value);
      if(ins[k].value===''||!Number.isInteger(n)||n<1||n>99){hint.textContent='Usa n\u00fameros enteros entre 1 y 99.';ins[k].focus();return}
      vals[k]=n;
    }
    var prev=DUR[mode];
    for(var j in vals)DUR[j]=vals[j]*60;
    try{localStorage.setItem('pomo-dur',JSON.stringify(vals))}catch(e){}
    closeSettings();
    if(DUR[mode]!==prev)setMode(mode);
  }
  $('settings').addEventListener('click',openSettings);
  $('save').addEventListener('click',saveSettings);
  $('cancel').addEventListener('click',closeSettings);
  ov.addEventListener('click',function(e){if(e.target===ov)closeSettings()});

  var fsBtn=$('full');
  function isFs(){return root.classList.contains('fs')}
  function enterFs(){
    root.classList.add('fs');fsBtn.blur();
    var sa=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
    var r=(!sa&&root.requestFullscreen)?root.requestFullscreen():null;
    if(r&&r.catch)r.catch(function(){});
  }
  function exitFs(){
    root.classList.remove('fs');
    if(document.fullscreenElement&&document.exitFullscreen){var r=document.exitFullscreen();if(r&&r.catch)r.catch(function(){})}
  }
  fsBtn.addEventListener('click',function(){isFs()?exitFs():enterFs()});
  document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&isFs())exitFs()});
  document.addEventListener('dblclick',function(){if(isFs())exitFs()});

  document.addEventListener('keydown',function(e){
    var tg=e.target.tagName;
    if(!ov.hidden){
      if(e.key==='Escape')closeSettings();
      else if(e.key==='Enter'&&tg==='INPUT')saveSettings();
      return;
    }
    if(e.key==='Escape'&&isFs()){exitFs();return}
    if(tg==='INPUT')return;
    if(e.code==='Space'&&tg!=='BUTTON'){e.preventDefault();toggle()}
    else if((e.key==='f'||e.key==='F')&&!e.metaKey&&!e.ctrlKey){isFs()?exitFs():enterFs()}
  });

  var rotFrom=null;
  function devPortrait(){
    try{if(screen.orientation&&screen.orientation.type)return screen.orientation.type.indexOf('portrait')===0}catch(e){}
    if(typeof window.orientation==='number')return Math.abs(window.orientation)!==90;
    return window.innerHeight>=window.innerWidth;
  }
  function setRot(on){root.classList.toggle('rot',on);rotFrom=on?devPortrait():null}
  function flipOrientation(){
    if(root.classList.contains('rot')){setRot(false);return}
    var want=devPortrait()?'landscape':'portrait', o=screen.orientation, pr=null;
    if(o&&o.lock){try{pr=o.lock(want)}catch(e){pr=null}}
    if(pr&&pr.then){pr.catch(function(){setRot(true)})}else setRot(true);
  }
  function onOri(){if(root.classList.contains('rot')&&devPortrait()!==rotFrom)setRot(false)}
  $('rotate').addEventListener('click',flipOrientation);
  window.addEventListener('orientationchange',onOri);
  try{screen.orientation.addEventListener('change',onOri)}catch(e){}

  render(true);
})();
</script>
<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
</body>
</html>
